[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gym"
version = "0.1.0"
description = "Small experiments with local LLMs and tool calling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "openai>=1.0",
]

[tool.setuptools]
py-modules = []