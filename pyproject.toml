[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gym"
version = "0.1.0"
description = "Small experiments with local LLMs and tool calling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "langchain-ollama>=1.0",
    "langchain-tavily>=0.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "langsmith",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
include = ["llm_gym*"]